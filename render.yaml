services:
  - type: web
    name: rag-api
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    healthCheckTimeout: 30
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_HOST
        value: "0.0.0.0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: RAG_BASE_PATH
        value: "/opt/render/project/src/data"

  - type: web
    name: rag-chat
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_API_KEY
        sync: false
      - key: RAG_BASE_PATH
        value: "/opt/render/project/src/data"

# Optional: Add persistent disk for ChromaDB (uncomment if you need persistence across deploys)
# disks:
#   - name: rag-data
#     mountPath: /opt/render/project/src/data
#     sizeGB: 1