services:
  - type: web
    name: rag-api
    env: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python api_server.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: GOOGLE_API_KEY
        sync: false

  - type: web
    name: rag-chat
    env: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_API_KEY
        sync: false
